# Elephant Gambit 1.0.0 against engines from the CCRL Blitz list (2'+1", list computed October 10, 2026).
# Every opponent is the exact version CCRL rates, fetched from its GitHub release of the same tag.
#
#   uwanja run gauntlets/elephant-1.0.0-ccrl-blitz.toml
#
# The book is the UHO_Lichess_4852_v1.epd OpenBench uses (sha256 7a7f6470...35644a), downloaded into books/:
#   https://raw.githubusercontent.com/AndyGrant/openbench-books/master/UHO_Lichess_4852_v1.epd.zip

name = "elephant-1.0.0-ccrl-blitz"
tc = "120+1"
book = "../books/UHO_Lichess_4852_v1.epd"
rounds = 50                  # game pairs per opponent: 14 opponents x 2 x 50 = 1400 games
concurrency = 10

[subject]
url = "https://github.com/looak/elephant"
ref = "1.0.0"
options = { Threads = 1, Hash = 64 }

[[opponent]]                 # CCRL Blitz 2278
url = "https://github.com/spamdrew128/Apotheosis"
ref = "v3.0.0"
id = "apotheosis-3"
options = { Hash = 64 }                # no Threads option, it's single threaded
rating = { value = 2278, list = "CCRL Blitz", as_of = "2026-10-10" }

