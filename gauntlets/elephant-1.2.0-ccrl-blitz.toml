# Elephant Gambit 1.2.0 against engines from the CCRL Blitz list (2'+1"), a field centred on where 1.2 is expected:
# 1.0.0 performed around 2740 against this list's 2750-2900 engines, 1.1 (mobility) and 1.2 (pawns) each passed SPRTs
# worth tens of Elo since. Opponents span 2660-3100 so each one scores roughly 25-75%; the 1.0.0 run spent half its
# games on engines it beat 80-90%. Every opponent is the exact version CCRL rates, from its GitHub release of that tag.
#
#   uwanja run gauntlets/elephant-1.2.0-ccrl-blitz.toml --dry-run   # fetch & probe every engine, play nothing
#   uwanja run gauntlets/elephant-1.2.0-ccrl-blitz.toml
#
# Same time control, book and pairs per opponent as elephant-1.0.0-ccrl-blitz.toml, so the two compare. The book is
# the UHO_Lichess_4852_v1.epd OpenBench uses (sha256 7a7f6470...35644a), in books/.
#
# For Linux x86-64 (played on Fedora): every opponent has a Linux build at its rated version. The 1.0.0 run's Weiawaga
# v5.0 (aarch64 only on Linux), Weiss v1.0 and Berserk 3.2.0 (Windows only) are replaced by Euwe and Shallow Guess.
# Cheers publishes an AVX2 build only.
#
# `binary` names the executable for every engine with a dot in its file name (fatalii-0.10.0): uwanja takes a
# Linux file for an executable only without an extension, and reads the version's last dot as one.
#
# The subject is a local build: 1.2.0 is a tag without a GitHub release. Build it from the tag with the OpenBench
# makefile and put it where `cmd` points (relative to this file):
#
#   git -C ../elephant checkout 1.2.0
#   make -C ../elephant/ob_build EXE=../../uwanja/engines/elephant-1.2.0

name = "elephant-1.2.0-ccrl-blitz"
tc = "120+1"
book = "../books/UHO_Lichess_4852_v1.epd"
rounds = 50                  # game pairs per opponent: 13 opponents x 2 x 50 = 1300 games
concurrency = 10

[subject]
cmd = "../engines/elephant-1.2.0"
name = "Elephant Gambit"
options = { Threads = 1, Hash = 64 }

# --- CCRL Blitz 2650-2800

[[opponent]]                 # 2663
url = "https://github.com/deanmchris/blunder"
ref = "v8.5.5"
binary = "*/linux/blunder-8.5.5-avx2"  # one zip with every OS and CPU build
options = { Hash = 64 }                # no Threads option
rating = { value = 2663, list = "CCRL Blitz", as_of = "2026-10-18" }

