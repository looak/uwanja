# Elephant Gambit 1.4.0 against engines from the CCRL Blitz list (2'+1"), the same field as
# elephant-1.2.0-ccrl-blitz.toml, plus Elephant 1.2.0 itself. 1.2.0 measured 2894 +- 16 against this field; 1.3 (king
# safety) and 1.4 (pieces, the rebalanced tables) passed SPRTs since. Same time control, book and pairs per opponent as
# the 1.0.0 and 1.2.0 runs, so the three compare.
#
#   uwanja run gauntlets/elephant-1.4.0-ccrl-blitz.toml --dry-run   # fetch & probe every engine, play nothing
#   uwanja run gauntlets/elephant-1.4.0-ccrl-blitz.toml
#
# Elephant 1.2.0 plays as an opponent without a rating. Its 2894 is this field's own estimate, not a CCRL number, and
# self-play stretches Elo differences (an engine beats its own predecessor by more than the two differ against
# others), so as an anchor it would pull 1.4.0's number up. Unrated, its result is the head-to-head gain over 1.2.0,
# read on its own next to the CCRL fit.
#
# For Linux x86-64 (played on Fedora), see elephant-1.2.0-ccrl-blitz.toml for the opponents' builds and the `binary`
# pitfall. The 1.2.0 binary is the one that run used. Both Elephants are local builds with the OpenBench makefile:
#
#   git -C ../elephant checkout 1.4.0
#   make -C ../elephant/ob_build EXE=../../uwanja/engines/elephant-1.4.0
#   git -C ../elephant checkout 1.2.0                                    # only if engines/elephant-1.2.0 is gone
#   make -C ../elephant/ob_build EXE=../../uwanja/engines/elephant-1.2.0

name = "elephant-1.4.0-ccrl-blitz"
tc = "120+1"
book = "../books/UHO_Lichess_4852_v1.epd"
rounds = 50                  # game pairs per opponent: 14 opponents x 2 x 50 = 1400 games
concurrency = 10

[subject]
cmd = "elephant-1.4.0"
name = "Elephant Gambit"
options = { Threads = 1, Hash = 256 }

# --- the predecessor, unrated: the head-to-head

[[opponent]]
cmd = "elephant-1.2.0"
id = "elephant-1.2.0"
name = "Elephant Gambit"
version = "1.2.0"
options = { Threads = 1, Hash = 256 }

