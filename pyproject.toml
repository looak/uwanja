[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uwanja"
version = "0.2.0"
description = "Engine-agnostic gauntlet runner: fetches UCI engines, plays them through fastchess, streams games and results to nyayo"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-only" }
dependencies = ["chess>=1.11", "py-cpuinfo>=9.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
uwanja = "uwanja.cli:main"

[tool.setuptools]
packages = ["uwanja"]

[tool.pytest.ini_options]
testpaths = ["tests"]
